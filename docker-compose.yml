services:
  agent-console:
    # Both, deliberately. A deployment sets AGENT_CONSOLE_IMAGE to a published
    # tag and pulls it; anyone else runs `docker compose up --build` and gets
    # the same thing built locally, with no registry and no account.
    build: .
    image: ${AGENT_CONSOLE_IMAGE:-agent-console:local}
    restart: unless-stopped
    # This box runs other things. Without a ceiling the console takes what it
    # takes, and what took the machine down was memory - agents are whole Claude
    # Code processes, not requests.
    #
    # A limit is not a substitute for the concurrency cap: it decides what
    # happens when the cap is wrong, which is that Docker kills this container
    # rather than the kernel killing something else on the machine.
    mem_limit: ${MEM_LIMIT:-4g}
    memswap_limit: ${MEMSWAP_LIMIT:-5g}
    cpus: ${CPU_LIMIT:-1.5}
    # An agent runs real commands, and a runaway one forks. This is the ceiling
    # on that, not on anything the console itself does.
    pids_limit: ${PIDS_LIMIT:-512}
    env_file: .env
    environment:
      # Inside the container these are fixed; the volumes below back them.
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
      HOST: 0.0.0.0
      PORT: 3000
    # Loopback only — put cloudflared or a reverse proxy in front.
    # HOST_PORT lets a deployment move off 3000 when something already holds it.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - data:/data
      - workspace:/workspace
      # Auth comes from CLAUDE_CODE_OAUTH_TOKEN in .env (see .env.example).
      # Only mount the CLI's config directory if you want to reuse a host login
      # instead — and note macOS keeps that credential in the Keychain, not on
      # disk, so the mount carries nothing there.
      # - ${CLAUDE_CONFIG_DIR:-~/.claude}:/home/agent/.claude
      # An Open Knowledge Format bundle describing this deployment goes in
      # docker-compose.override.yml rather than here: a deploy resets this
      # checkout, and the mount is specific to one server. See
      # docs/how-to/docker.md.
      # Uncomment to read the host's CPU/memory/network/disk numbers instead
      # of the container's own, and set HOST_PROC_PATH=/host/proc in .env to
      # match.
      # - /proc:/host/proc:ro
    # The healthcheck is defined on the image, so compose inherits it. Repeating
    # it here would be a second copy of the same probe, free to drift.

volumes:
  data:
  workspace:
