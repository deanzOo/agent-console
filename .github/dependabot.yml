version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      # One PR per risk class instead of one per package — a wall of 20 patch
      # PRs a week is how dependabot gets muted.
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    # Majors are deliberately not grouped. An update that matches no group gets
    # its own pull request, which is what gives a breaking change a review of
    # its own instead of a line in a list of six.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # Minor and patch only, for the same reason as npm: a major bump of an
      # action can change what a job does, and arriving inside a group of six
      # is how it gets read as routine.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope
