name: CI

# Only what lands on a protected branch is gated remotely. A stacked PR whose
# base is another feature branch runs nothing here — the full suite runs once,
# on the PR that actually reaches main, rather than on every branch in the
# stack. `npm run ci` and the pre-push hook are the signal until then.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check list lives in ci/checks.json so `npm run ci` and this matrix
  # cannot drift apart. Adding a check there adds it in both places.
  manifest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.read.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        run: echo "checks=$(jq -c '[.[] | {id, name, command, requires}]' ci/checks.json)" >> "$GITHUB_OUTPUT"

  check:
    timeout-minutes: 15
    needs: manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.manifest.outputs.checks) }}
    name: ${{ matrix.check.name }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Only the secret history scan reads past the tip; every other check
          # works on the tree it is given.
          # Quoted deliberately: a bare 0 is falsy in an Actions expression, so
          # `&& 0 || 1` yields 1 in both branches and the clone stays shallow —
          # which is how a history scan came to scan one commit.
          fetch-depth: ${{ matrix.check.requires == 'gitleaks' && '0' || '1' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install trivy
        if: matrix.check.requires == 'trivy'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      # Downloaded to a file and extracted rather than piped into a shell, and
      # pinned so a compromised latest release cannot walk in on its own.
      - name: Install gitleaks
        if: matrix.check.requires == 'gitleaks'
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      # Read by the summary job, so the suite runs once rather than again just
      # to report on itself.
      - name: Keep the coverage summary
        if: matrix.check.id == 'tests'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

  # Needs the pull request's commit range, which does not exist locally.
  commits:
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint commit messages
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      - name: Check commit trailers
        run: |
          git log --format=%B origin/${{ github.base_ref }}..HEAD > /tmp/commits.txt
          bash scripts/check-commit-trailers.sh /tmp/commits.txt

  # `npm audit` reports on what is already in the lockfile. This objects while
  # the dependency is still a proposal, which is the only point at which not
  # taking it is free.
  dependencies:
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          # Copyleft licences would change what a peer cloning this is allowed
          # to do with it, which is a decision rather than an oversight.
          deny-licenses: AGPL-3.0, GPL-3.0, LGPL-3.0

  # What a reviewer wants before reading a line: how much moved, whether tests
  # came with it, and whether any file it touches is unreached by them.
  summary:
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The summary is a diff against the base, which a shallow clone
          # cannot compute.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-summary
          path: coverage

      - name: Build the summary
        id: summary
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo 'body<<PR_SUMMARY_EOF'
            git diff --numstat "$BASE...HEAD" \
              | node scripts/pr-summary.mjs --coverage coverage/coverage-summary.json
            echo 'PR_SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      # Always written, including for a pull request from a fork, where posting
      # a comment is impossible. The summary is still one click away in the run.
      - name: Show it in the run
        env:
          BODY: ${{ steps.summary.outputs.body }}
        run: printf '## PR summary\n\n%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"

      # Edited in place rather than appended: a new comment on every push turns
      # a busy pull request into a wall of stale summaries.
      #
      # Skipped for a fork, where GITHUB_TOKEN is read-only however the workflow
      # declares its permissions - without this every outside contributor's pull
      # request fails a job they cannot fix.
      - name: Post it
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ steps.summary.outputs.body }}
          MARKER: "<!-- pr-summary -->"
        run: |
          printf '%s\n\n%s\n' "$MARKER" "$BODY" > comment.md
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md > /dev/null
          fi

  # Green only when every matrix leg is. This is the single required status
  # check to select in branch protection — a new check in the manifest is then
  # covered automatically instead of needing the setting updated.
  ci:
    timeout-minutes: 10
    if: always()
    needs: [check, commits, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more checks failed."
            exit 1
          fi
