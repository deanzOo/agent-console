name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed CVEs in unchanged dependencies still surface.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Gate: fails the build on anything HIGH or worse. Human-readable output
      # so a failed run is actionable without opening the Security tab.
      - name: Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Full inventory into code scanning, including LOW/MEDIUM. Never fails the
      # build, and tolerates repos without code scanning enabled.
      - name: Trivy (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-results.sarif

  # The image is otherwise built for the first time on the operator's server, so
  # a broken Dockerfile surfaces at deploy. Building it here also makes the base
  # image scannable: its OS packages are invisible to a filesystem scan of the
  # source tree, and they are the ones nobody bumps.
  image:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the image
        run: docker build -t agent-console:ci .

      # The agent CLI is installed into the image and every mission starts by
      # spawning it. A broken install is invisible to every other check and
      # only shows up as a mission that dies at startup - which is how it
      # shipped once already.
      - name: The agent CLI runs
        run: docker run --rm agent-console:ci claude --version

      - name: Trivy (image gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agent-console:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # npm's own bundled dependencies, which this repository cannot patch.
          # Three advisories landed here in four days - two on the same file -
          # and each needed its own dated exception, which is a treadmill rather
          # than a decision. The image already installs npm@latest at build, so
          # these are fixed by upgrading npm and by nothing else we can do.
          #
          # Deliberately narrow: /app/node_modules is still scanned, and so is
          # every OS package. What is skipped is the copy npm ships inside
          # itself.
          skip-dirs: usr/local/lib/node_modules/npm

      # What is actually inside the thing an operator runs, so a future CVE can
      # be answered from the release rather than by guessing.
      - name: Build an SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agent-console:ci
          format: cyclonedx
          output: sbom.cdx.json

      - name: Keep the SBOM
        if: always() && hashFiles('sbom.cdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
