# Surfaced deliberately rather than silently: this is npm's own bundled copy,
# inside the Node base image, and no published npm carries the fixed version
# yet. Nothing in this repository can move it, and removing npm from the image
# would take away what agents use to run the projects they work on.
#
# The date is the point of it: this stops being ignored on its own, so it comes
# back as a failure if npm has not shipped the fix by then.
vulnerabilities:
  - id: CVE-2026-14257
    paths:
      - "usr/local/lib/node_modules/npm/node_modules/brace-expansion/package.json"
    statement: "brace-expansion inside npm's own bundle; fix not yet in any published npm"
    expired_at: 2026-09-15
