[extend]
useDefault = true

# `.env.example` is the configuration contract: every key present, every value
# empty, each explained by a comment. The generic-api-key rule keeps matching
# that prose — "paste an API key:", "billed per token:" — sitting beside an
# empty assignment. Which sentence it picks depends on whether the scan sees
# history or one squashed tree, so chasing them one at a time does not converge.
#
# The file is skipped here and guarded instead by
# scripts/check-no-hardcoded-config.sh, which fails if any key in it carries a
# value at all. That is the stronger rule: gitleaks would only object to a value
# that looks secret, while the guard objects to every value.
[[allowlists]]
description = "The configuration contract, guarded by its own check"
paths = ['''^\.env\.example$''']
